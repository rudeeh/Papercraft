services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.28.4
    command: ["--host", "0.0.0.0", "--port", "8080", "--scheme", "http"]
    ports:
      - "8082:8080"    # host 8082 -> container 8080 (8080 is taken by the frontend)
      - "50051:50051"  # gRPC (used by the v4 python client)
    environment:
      - AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED=true
      - PERSISTENCE_DATA_PATH=/var/lib/weaviate
      - QUERY_DEFAULTS_LIMIT=25
      - DISABLE_TELEMETRY=true
    volumes:
      - weaviate_data:/var/lib/weaviate

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=papercraft
      - POSTGRES_PASSWORD=papercraft
      - POSTGRES_DB=papercraft
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U papercraft -d papercraft"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"   # Browser UI
      - "7687:7687"   # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    build: .
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
      - uploads_data:/app/uploads
    depends_on:
      redis:
        condition: service_started
      weaviate:
        condition: service_started
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  worker:
    build: .
    # Celery worker command
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-2}
    env_file:
      - .env
    volumes:
      - .:/app
      - uploads_data:/app/uploads
      # Share torch cache if needed
      - torch_cache:/root/.cache/torch
      - huggingface_cache:/root/.cache/huggingface
    depends_on:
      redis:
        condition: service_started
      weaviate:
        condition: service_started
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  # The Angular app is the mature UI (upload, ask, citation explorer).
  frontend:
    build: ./frontend-angular
    ports:
      - "8080:80"
    depends_on:
      - api

  # The Next.js app is the spec's target frontend, currently covering
  # ingest / ask / review-queue. Both are served so neither blocks the other.
  web:
    build: ./web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api

volumes:
  redis_data:
  weaviate_data:
  neo4j_data:
  postgres_data:
  minio_data:
  uploads_data:
  torch_cache:
  huggingface_cache: