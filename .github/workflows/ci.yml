name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the Dockerfile's base image, so a dependency that only
          # resolves on a newer Python fails here rather than at image build.
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        # The full requirements.txt pulls torch via doctr (~2 GB) for OCR,
        # which no unit test exercises -- they patch app.services.ocr. This
        # installs the rest, and the "imports" job below is what proves the
        # pinned set still resolves as a whole.
        run: |
          python -m pip install --upgrade pip
          pip install numpy $(grep -vE '^(sentence-transformers|python-doctr)' requirements.txt | grep -v '^#' | grep -v '^$' | tr '\n' ' ')

      - name: Verify lightweight embedding imports
        run: |
          python -c "import numpy"
          python -c "from app.services import embeddings; assert callable(embeddings.get_model)"

      - name: Check the pinned dependency set is consistent
        run: pip check

      - run: pytest -q

  resolve:
    name: Full requirements resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve requirements.txt without installing
        # Catches exactly the failure that made `docker compose up --build`
        # dead on arrival: weaviate-client and pydantic pinned to versions
        # with no common solution.
        run: |
          python -m pip install --upgrade pip
          pip install --dry-run --report /dev/null -r requirements.txt

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
